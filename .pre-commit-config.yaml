# Install the git hook once with:  uv run pre-commit install
# Run it over everything with:     uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Two trailing spaces are a hard line break in Markdown, not stray
      # whitespace. Stripping them silently reflows the paragraph, which
      # is a documentation change nobody asked for and nobody reviews.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^app/static/
      # app/static holds third-party bundles at a pinned version. Their
      # bytes should stay the CDN's bytes, so that what is served can be
      # checked against what was published; a newline added on our side
      # makes that comparison fail and proves nothing.
      - id: end-of-file-fixer
        exclude: ^app/static/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      # Catches a key pasted into a file before it reaches a remote, which
      # is the one mistake in this repository that cannot be undone.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run from the project environment rather than an isolated one: mypy
      # needs the project's dependencies installed to see their types at all.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
